[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soomfon-control"
version = "0.1.0"
description = "JSON-configured SOOMFON CN002 app launcher and media controller for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "soomfon @ https://github.com/DeastinY/soomfon/archive/177520995cf76bab62eb2f9d9514eefbb06855bc.zip",
  "Pillow>=10.0",
  "psutil>=5.9",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soomfon-control = "soomfon_control.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

